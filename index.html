<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PicoRubyKaigi 2026 Assemble</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage">
    <div class="wrap">

      <div class="top">
        <div class="meta">
          <div class="when">2026.10.31.</div>
          <div class="where"><span class="micon">location_on</span>浅草橋ヒューリックホール&amp;カンファレンス</div>
        </div>

        <div class="scene">
          <img class="ruby" src="images/ruby.png" alt="Ruby">
          <svg class="ruby-facets" viewBox="0 0 1078 955" aria-hidden="true">
            <polygon class="facet" data-face="table"     points="800,180 652,244 418,237 280,192 229,143 226,91 403,22 714,24 851,88 846,140"/>
            <polygon class="facet" data-face="leftCrown" points="280,192 275,465 30,355 224,147"/>
            <polygon class="facet" data-face="rC"        points="852,143 1066,354 790,475 800,189"/>
            <polygon class="facet" data-face="mid"       points="652,254 783,470 293,472 426,253"/>
            <polygon class="facet" data-face="pFL"       points="14,378 150,478 538,945"/>
            <polygon class="facet" data-face="pCenter"   points="539,942 288,477 783,480"/>
            <polygon class="facet" data-face="pFR"       points="802,484 1066,352 538,945"/>
            <g class="spark" transform="translate(-400,-400)"></g>
          </svg>
          <span class="builder" style="left:6%;top:0;--ty:150px;--dd:3.6s;--sx:-90px"><img class="flip" src="images/builder2.png" alt="builder"></span>
          <span class="builder" style="right:4%;top:-3%;--ty:168px;--dd:4.2s;--ddl:-1.9s;--sx:90px"><img src="images/builder4.png" alt="builder"></span>
        </div>

        <div class="keynotes">
          <span class="keynote-label">Keynote Speakers</span>
          <span class="keynote-name">Hitoshi HASUMI</span>
          <span class="keynote-name">Yukihiro "Matz" Matsumoto</span>
        </div>
      </div>

      <div class="title">
        <div class="prk"><span class="picoruby">PicoRuby</span>Kaigi</div>
        <div class="year">2026</div>
        <div class="assemble">- Assemble -</div>
      </div>

      <div class="button">
        <a class="button-icon ticket" href="#ticket"><span class="button-label-jp">参加登録</span><span class="button-label-en">Get a Ticket</span></a>
        <a class="button-icon proposal" href="#cfp"><span class="button-label-jp">プロポーザル</span><span class="button-label-en">Call for Proposal</span></a>
        <a class="button-icon sponsor" href="#sponsor"><span class="button-label-jp">スポンサー</span><span class="button-label-en">Become a Sponsor</span></a>
      </div>

    </div>
  </div>

<script src="sound.js"></script>
<script src="script.js"></script>
</body>
</html>
