  <script>
  // 8bit SFX. Sound is platform territory (the board will use a buzzer here),
  // so it lives in JS while the game core stays in pure Ruby.
  window.gameSfx = (function () {
    var ctx = null;
    function ac() {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function beep(freq, dur, type, gain, when) {
      var c = ac();
      var t = c.currentTime + (when || 0);
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(c.destination);
      o.start(t);
      o.stop(t + dur + 0.02);
    }
    // Major scale: lock pitch climbs one degree per stacked row
    var SCALE = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19];
    function degree(level) {
      var i = level < 0 ? 0 : level > 11 ? 11 : level;
      return 330 * Math.pow(2, SCALE[i] / 12);
    }
    return {
      start: function () { beep(440, 0.08, 'square', 0.05); beep(660, 0.1, 'square', 0.05, 0.09); },
      // single lock/hit blip, pitched by progress
      lock: function (level) { beep(degree(level), 0.07, 'square', 0.05); },
      // PERFECT: two quick chirps that climb with the chain
      perfect: function (chain) {
        var f = degree(chain);
        beep(f, 0.05, 'square', 0.05);
        beep(f * 1.5, 0.08, 'square', 0.05, 0.06);
      },
      over: function () { beep(220, 0.12, 'square', 0.06); beep(165, 0.14, 'square', 0.06, 0.13); beep(110, 0.3, 'sawtooth', 0.06, 0.28); },
      // ghost move accepted: a tiny cornering swoosh (pitch glide)
      tick: function () {
        var c = ac();
        var t = c.currentTime;
        var o = c.createOscillator();
        var g = c.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(780, t);
        o.frequency.exponentialRampToValueAtTime(1450, t + 0.07);
        g.gain.setValueAtTime(0.028, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
        o.connect(g);
        g.connect(c.destination);
        o.start(t);
        o.stop(t + 0.11);
      },
      // "can't drop here" / first-fit fallback: a soft low thud,
      // gentle enough to hear twenty times in a row without wincing
      deny: function () { beep(160, 0.06, 'triangle', 0.03); },
      // tetra harvest: quick sweep arpeggio
      win: function () {
        [0, 4, 7, 12, 7, 12, 16, 19].forEach(function (s, i) {
          beep(523 * Math.pow(2, s / 12), 0.12, 'square', 0.05, i * 0.11);
        });
      }
    };
  })();
  </script>
