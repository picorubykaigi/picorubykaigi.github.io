<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PicoRubyKaigi 2026 Assemble SUZURI フルグラフィックTシャツ 枠線つきプレビュー</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #888;
  font-family: monospace;
  padding: 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 24px;
  justify-content: center;
}
h1 {
  width: 100%;
  color: #eee;
  font-size: 13px;
  font-weight: normal;
  letter-spacing: .06em;
  text-align: center;
}

.card {
  width: 483px;
}
.card .name {
  color: #eee;
  font-size: 12px;
  letter-spacing: .06em;
  margin-bottom: 6px;
}
/* デザイン(plain.htmlのキャプチャ表示)の上にテンプレートの枠線を重ねる。
   ライトは黒線をそのまま乗算、ダークは線をグレスケ反転して白线にしスクリーン合成 */
.stagebox {
  position: relative;
  width: 483px;
  height: 377px;
  overflow: hidden;
}
.stagebox iframe {
  position: absolute;
  left: 0;
  top: 0;
  width: 1507px;
  height: 1177px;
  border: 0;
  transform: scale(.3205);
  transform-origin: 0 0;
  pointer-events: none;
}
.stagebox .tpl {
  position: absolute;
  left: 0;
  top: 0;
  width: 483px;
  height: 377px;
  pointer-events: none;
  mix-blend-mode: multiply;
}
.card.dark .tpl {
  filter: grayscale(1) invert(1);
  mix-blend-mode: screen;
}
</style>
</head>
<body>
  <h1>SUZURI フルグラフィックTシャツ 枠線つきプレビュー (a=main-visual / b=prarail / c=parts(パーツの 4×3 格子+Assemble!))。枠線なしは plain.html</h1>
<script>
  const params = new URLSearchParams(location.search);
  const extra = params.get('guide') ? '&guide=1' : '';
  const TPL = '../../suzuri-template-full-graphic-t-shirt';
  for (const face of ['a-front', 'a-back', 'b-front', 'b-back', 'c-front', 'c-back']) {
    for (const mode of ['light', 'dark']) {
      const side = face.split('-')[1];
      const card = document.createElement('div');
      card.className = `card ${mode}`;
      card.innerHTML = `
        <div class="name">${face}-${mode}</div>
        <div class="stagebox">
          <iframe src="plain.html?capture=${face}-${mode}${extra}" scrolling="no"></iframe>
          <img class="tpl" src="${TPL}/${side}/M/m_${side}.png" alt="">
        </div>`;
      document.body.appendChild(card);
    }
  }
</script>
</body>
</html>
