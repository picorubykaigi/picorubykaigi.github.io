<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PicoRubyKaigi 2026 Assemble ステッカー案</title>
<!-- ステッカーの案を並べて見比べるページ。1 枚 50mm 角を基本に角丸 --r で切る。html の背景をグレーにして枠の端を見せる。
     ?r=6 で角丸の半径(mm)を変えられる。 -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Bitcount+Single:ELSH,wght@0..100,100..900&family=Micro+5&family=Jersey+10&family=DotGothic16&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  background: #888;
}

body {
  font-family: 'DotGothic16', monospace;
  padding: 8mm;
  display: flex;
  flex-direction: column;
  gap: 18mm;
  align-items: flex-start;
  color: #eee;
  --r: 4mm;
  --bg: #eceade;
  --ink: #26242f;
  --dots: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2724%27%20height=%2724%27%3E%3Crect%20x=%279.5%27%20y=%279.5%27%20width=%275%27%20height=%275%27%20fill=%27%2339352b%27%20fill-opacity=%27.11%27/%3E%3Crect%20x=%2711%27%20y=%2711%27%20width=%275%27%20height=%275%27%20fill=%27%231c180e%27%20fill-opacity=%27.14%27/%3E%3C/svg%3E");
  --dots-dark: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2724%27%20height=%2724%27%3E%3Crect%20x=%279.5%27%20y=%279.5%27%20width=%275%27%20height=%275%27%20fill=%27%232e5247%27/%3E%3Crect%20x=%2711%27%20y=%2711%27%20width=%274%27%20height=%274%27%20fill=%27%2316302a%27/%3E%3C/svg%3E");
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 10mm 8mm;
  width: 100%;
}

.item {
  display: flex;
  flex-direction: column;
  gap: 2mm;
  align-items: center;
}

.item .label {
  font-size: 3mm;
  letter-spacing: .06em;
}

/* 穴のドットは 19 x 19 個を端から 2mm ずつ等間隔に(ピッチ 2.556mm)。タイル内のドット中心は 12.75/24 なので、位置を 2mm - 1.358mm にずらす。
   端のドットの外側の次のドットは枠の外に出るので、縁で欠けたドットが出ない */
.sticker {
  position: relative;
  width: 50mm;
  height: 50mm;
  overflow: hidden;
  border-radius: var(--r);
  color: var(--ink);
  --pitch: 2.556mm;
  --dot-offset: .642mm;
  background: var(--dots) left var(--dot-offset) top var(--dot-offset) / var(--pitch) var(--pitch) repeat, var(--bg);
}

.sticker.dark {
  --bg: #10131c;
  --ink: #ece9df;
  background: var(--dots-dark) left var(--dot-offset) top var(--dot-offset) / var(--pitch) var(--pitch) repeat, var(--bg);
}

/* ===== 文字ロゴ(ショップカードと同じ組み方。線幅は文字サイズに比例) ===== */
.prk {
  font-family: 'Bitcount Single', sans-serif;
  line-height: .98;
  letter-spacing: .05em;
  font-variation-settings: 'wght' 330, 'ELSH' 50;
  text-align: center;
}
.prk .picoruby,
.prk .kaigi {
  white-space: nowrap;
  position: relative;
  paint-order: stroke fill;
  -webkit-text-stroke: .0585em var(--frame);
}
.prk .picoruby { color: #f64b5b; --frame: #da1d3c; }
.prk .kaigi    { color: #fff;    --frame: #454747; }
.dark .prk .picoruby { color: #fb5479; --frame: #97233a; }
.dark .prk .kaigi    { color: #6ef0a0; --frame: #2c6b4a; }
.prk.stack .picoruby,
.prk.stack .kaigi { display: block; }
.prk.stack .picoruby { left: .073em; }
.prk.stack .kaigi    { left: .078em; }
.prk .k2 { letter-spacing: .036em; }
.prk .k3 { letter-spacing: .029em; }
.prk .k4 { letter-spacing: .022em; }
.prk .k5 { letter-spacing: .015em; }
.prk .kP { letter-spacing: .026em; }
.year {
  font-family: 'Micro 5', sans-serif;
  line-height: .8;
  letter-spacing: .12em;
  text-indent: .12em;
  text-align: center;
}
.assemble {
  font-family: 'Jersey 10', sans-serif;
  letter-spacing: .18em;
  text-indent: .18em;
  text-align: center;
}
.title {
  position: absolute;
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== 絵(サイトの PNG をそのまま、ドット絵のまま拡大) ===== */
.img {
  position: absolute;
  background: center / contain no-repeat;
  image-rendering: pixelated;
}
.img.ruby     { aspect-ratio: 990 / 809; background-image: url('../../images/ruby-1.png'); }
.img.rubym    { aspect-ratio: 438 / 353; background-image: url('../../images/ruby-mini.png'); }
.img.seg7     { aspect-ratio: 211 / 165; background-image: url('../shopcard/7seg-88.png'); }
.img.speaker  { aspect-ratio: 137 / 138; background-image: url('../../images/spaeker.png'); }
.img.motor    { aspect-ratio: 110 / 141; background-image: url('../../images/motor.png'); }
.img.chip     { aspect-ratio: 137 / 137; background-image: url('../../images/chip.png'); }
.img.battery  { aspect-ratio: 110 / 188; background-image: url('../../images/battery.png'); }
.img.rocket   { aspect-ratio: 349 / 499; background-image: url('../../images/goodies/rocket.png'); }
.img.nui      { aspect-ratio: 407 / 477; background-image: url('../../images/goodies/nui.png'); }
.img.keyboard { aspect-ratio: 523 / 365; background-image: url('../../images/goodies/keyboard.png'); }
.img.penlight { aspect-ratio: 261 / 552; background-image: url('../../images/goodies/penlight.png'); }
.img.pico     { aspect-ratio: 810 / 409; background-image: url('../../images/goodies/pico.png'); }
.img.breadboard { aspect-ratio: 687 / 568; background-image: url('../../images/goodies/breadboard.png'); }

/* ===== A: 大きな Ruby が主役。文字ロゴは D と同じ 1 行の PicoRubyKaigi + 2026 Assemble を小さく下に ===== */
.a .ruby { left: 50%; top: 6.7mm; transform: translateX(-50%); width: 28mm; }
.a .title { top: 34.7mm; gap: 0; }
.a .prk { font-size: 4.95mm; line-height: 1; position: relative; left: .75mm; }  /* D と同じく、右端の i のぶん少し右へ */
.a .row2 { display: flex; align-items: baseline; gap: 1.2mm; margin-top: 1.1mm; position: relative; left: .2mm; }
.a .year { font-size: 4mm; }
.a .assemble { font-size: 3.2mm; }

/* ===== B: 2 行組みの文字ロゴ(C と同じ大きさ)だけ。中央に ===== */
.b .title { top: 13mm; gap: 1.6mm; }
.b .prk { font-size: 7.6mm; }
.b .year { font-size: 6.2mm; margin-top: -1.2mm; }
.b .assemble { font-size: 3.2mm; margin-top: -.5mm; }

/* ===== C: ダーク。リン光の文字と、角にピクセルの十字光 ===== */
.c .title { top: 13.5mm; gap: 1.6mm; }
.c .prk { font-size: 7.6mm; }
.c .year { font-size: 6.2mm; color: #ece9df; }
.c .assemble { font-size: 3.2mm; margin-top: -.5mm; color: #ece9df; }
/* ピクセルの十字光(ぼかしなし。芯=白 / 先端=色) */
.spark {
  position: absolute;
  width: .7mm;
  height: .7mm;
  background: #fff;
  box-shadow:
    0 -.7mm #fff, 0 .7mm #fff, -.7mm 0 #fff, .7mm 0 #fff,
    0 -1.4mm var(--tint), 0 1.4mm var(--tint), -1.4mm 0 var(--tint), 1.4mm 0 var(--tint);
}
.spark.pink  { --tint: #ff96b9; }
.spark.green { --tint: #56f096; }
.spark.blue  { --tint: #8ad9ff; }
.confetti {
  position: absolute;
  width: .9mm;
  height: .9mm;
}
.confetti.r45 { transform: rotate(45deg); }

/* ===== C-30: C をそのまま 30mm 角に。中身は 50mm 座標のまま 0.6 倍、穴のドットは同じ大きさのまま 11 x 11 個(ピッチ 2.6mm、端から 2mm)に組み直す ===== */
.sticker.s30 {
  width: 30mm;
  height: 30mm;
  border-radius: calc(var(--r) * .6);
  --pitch: 2.6mm;
  --dot-offset: .619mm;
}
.s30 .scale {
  position: absolute;
  left: 0;
  top: 0;
  width: 50mm;
  height: 50mm;
  transform: scale(.6);
  transform-origin: 0 0;
}

/* ===== E / F: Official Party の OGP の要素(夜空のグラデ、虹色に塗った LED ルビー、紙吹雪多め)を取り込む。文字の 3 色ずらし影は 30mm だと見えないので入れない ===== */
.sticker.party {
  background:
    var(--dots-dark) left var(--dot-offset) top var(--dot-offset) / var(--pitch) var(--pitch) repeat,
    linear-gradient(#080b13 0%, #10131c 55%, #171c2b 100%);
}
.rubyg {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  aspect-ratio: 1073 / 869;
  background: linear-gradient(118deg, #e8404b 0%, #fb5479 28%, #ffc12e 56%, #6ef0a0 76%, #55d6f2 100%);
  -webkit-mask: url('../../images/ruby-2.png') center / contain no-repeat;
  mask: url('../../images/ruby-2.png') center / contain no-repeat;
}
.party .year,
.party .assemble { color: #f6f4ea; }

/* E: 虹色ルビーだけを真ん中に。文字なし */
.e .rubyg { top: 50%; width: 30mm; transform: translate(-50%, -50%); }


/* ===== 電飾の枠(G2 / F2 で使う) ===== */
/* E6: 縁の内側 3.4mm に 4 色の電飾。横辺は 1.6×0.8mm の横線、縦辺は 0.8×1.6mm の縦線を 3.2mm ピッチで 14 本ずつ。
   角は横線と縦線が L 字に重なって同じ色になり、一周 52 本が 4 色の順でつながる(52 は 4 の倍数)。
   左上の角(0,0)は box-shadow では要素の下になって描けないので要素自身の背景色で描く */
.ring-h,
.ring-v {
  position: absolute;
  left: 3.4mm;
  top: 3.4mm;
  background: #fb5479;
}
.ring-h {
  width: 1.6mm;
  height: 0.8mm;
  box-shadow:
    0mm 0mm #fb5479,
    0mm 42.4mm #55d6f2,
    3.2mm 0mm #ffc12e,
    3.2mm 42.4mm #6ef0a0,
    6.4mm 0mm #6ef0a0,
    6.4mm 42.4mm #ffc12e,
    9.6mm 0mm #55d6f2,
    9.6mm 42.4mm #fb5479,
    12.8mm 0mm #fb5479,
    12.8mm 42.4mm #55d6f2,
    16mm 0mm #ffc12e,
    16mm 42.4mm #6ef0a0,
    19.2mm 0mm #6ef0a0,
    19.2mm 42.4mm #ffc12e,
    22.4mm 0mm #55d6f2,
    22.4mm 42.4mm #fb5479,
    25.6mm 0mm #fb5479,
    25.6mm 42.4mm #55d6f2,
    28.8mm 0mm #ffc12e,
    28.8mm 42.4mm #6ef0a0,
    32mm 0mm #6ef0a0,
    32mm 42.4mm #ffc12e,
    35.2mm 0mm #55d6f2,
    35.2mm 42.4mm #fb5479,
    38.4mm 0mm #fb5479,
    38.4mm 42.4mm #55d6f2,
    41.6mm 0mm #ffc12e,
    41.6mm 42.4mm #6ef0a0;
}
.ring-v {
  width: 0.8mm;
  height: 1.6mm;
  box-shadow:
    42.4mm 0mm #ffc12e,
    0mm 0mm #fb5479,
    42.4mm 3.2mm #6ef0a0,
    0mm 3.2mm #55d6f2,
    42.4mm 6.4mm #55d6f2,
    0mm 6.4mm #6ef0a0,
    42.4mm 9.6mm #fb5479,
    0mm 9.6mm #ffc12e,
    42.4mm 12.8mm #ffc12e,
    0mm 12.8mm #fb5479,
    42.4mm 16mm #6ef0a0,
    0mm 16mm #55d6f2,
    42.4mm 19.2mm #55d6f2,
    0mm 19.2mm #6ef0a0,
    42.4mm 22.4mm #fb5479,
    0mm 22.4mm #ffc12e,
    42.4mm 25.6mm #ffc12e,
    0mm 25.6mm #fb5479,
    42.4mm 28.8mm #6ef0a0,
    0mm 28.8mm #55d6f2,
    42.4mm 32mm #55d6f2,
    0mm 32mm #6ef0a0,
    42.4mm 35.2mm #fb5479,
    0mm 35.2mm #ffc12e,
    42.4mm 38.4mm #ffc12e,
    0mm 38.4mm #fb5479,
    42.4mm 41.6mm #6ef0a0,
    0mm 41.6mm #55d6f2;
}

/* E14: E3 のルビーを上げて、下に Official Party(OGP と同じ Jersey 10)を 1 行 */
.party-text {
  position: absolute;
  left: 0;
  right: 0;
  font-family: 'Jersey 10', sans-serif;
  line-height: .9;
  letter-spacing: .14em;
  text-indent: .14em;
  text-align: center;
  color: #f6f4ea;
}
.e14 .rubyg { top: 8.6mm; width: 28mm; transform: translateX(-50%); }
.e14 .party-text { top: 36.3mm; font-size: 5.8mm; }
/* E15: Official / Party の 2 行で大きく */
.e15 .rubyg { top: 6.3mm; width: 26mm; transform: translateX(-50%); }
.e15 .party-text { top: 31.8mm; font-size: 6.6mm; }

/* G2: 枠の内側に収めるため、G よりルビーと文字を少し小さくして枠から 4mm あける */
.g2 .rubyg { top: 8.3mm; width: 23mm; }
.g2 .party-text { top: 30.9mm; font-size: 6mm; }

/* F2: F に E6 の枠。枠から離すためルビーと文字を少し小さく */
.f2 .rubyg { top: 9.9mm; width: 26mm; }
.f2 .party-text { top: 35.3mm; font-size: 5.4mm; }

/* G3: 文字を Party だけにして大きく(枠あり) */
.g3 .rubyg { top: 11mm; width: 23mm; }
.g3 .party-text { top: 33.2mm; font-size: 7.5mm; }

/* G9: 緑の帯を少しだけ広くとる(18〜36%)。G6 と G8 の中間 */
.party-text.rainbow-rev-green2 {
  background: linear-gradient(118deg, #55d6f2 0%, #6ef0a0 18%, #6ef0a0 36%, #ffc12e 56%, #fb5479 80%, #e8404b 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* ===== D: Tシャツ c の格子(4 列 x 3 行)の並びのまま、列・行の間隔を 130px → 100px に詰め、下に 1 行ロゴ+2026 Assemble ===== */
/* c の各マス内の位置はそのままに、マスの間隔だけ詰めた座標(幅 357 x 高さ 350px)を 0.44 倍にして中央に置く */
/* 穴のドットはモーターの 2 本のピン(実測 x 41.44 / 44.19mm、y 33.15mm)に乗るようピッチ 2.75mm・17 x 17 個(端から 3mm)にする。
   チップの左右のピン(x 16.99 / 22.02mm)も列に乗る。ほかのパーツのピンは間隔が違うので合わせない */
.d {
  --pitch: 2.75mm;
  --dot-offset: 1.539mm;
}
.d .grid {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 357px;
  height: 364px;
  transform: translate(-50%, -50%) scale(.44);
}
.d .grid .title { top: 291px; gap: 0; }
.d .grid .prk { font-size: 40px; line-height: 1; position: relative; left: 4px; }  /* 右端の i が細く右の余白が広く見えるので、少し右へ */
.d .grid .prk .picoruby,
.d .grid .prk .kaigi { -webkit-text-stroke-width: 2.4px; }
.d .grid .row2 { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; position: relative; left: 2px; }
.d .grid .year { font-size: 34px; }
.d .grid .assemble { font-size: 27px; }
</style>
</head>
<body>

<div class="row">
<!-- A -->
<div class="item">
  <div class="sticker a">
    <div class="img ruby"></div>
    <div class="title">
      <div class="prk"><span class="picoruby"><span class="kP">P</span><span class="k4">ic</span>oRu<span class="k2">b</span>y</span><span class="kaigi"><span class="k4">K</span><span class="k3">a</span><span class="k5">i</span><span class="k3">g</span>i</span></div>
      <div class="row2"><div class="year">2026</div><div class="assemble">Assemble</div></div>
    </div>
  </div>
  <div class="label">A</div>
</div>

<!-- F2: F に E6 の電飾の枠 -->
<div class="item">
  <div class="sticker e e14 f2 dark s30">
    <div class="scale">
      <div class="ring-h"></div>
      <div class="ring-v"></div>
      <div class="rubyg"></div>
      <div class="party-text">Official Party</div>
    </div>
  </div>
  <div class="label">F2</div>
</div>

<!-- G9: 枠つき、PARTY 1 行(白) -->
<div class="item">
  <div class="sticker e e15 g3 dark s30">
    <div class="scale">
      <div class="ring-h"></div>
      <div class="ring-v"></div>
      <div class="rubyg"></div>
      <div class="party-text">PARTY</div>
    </div>
  </div>
  <div class="label">G9</div>
</div>

<!-- G10: G9 の PARTY の両脇に十字光 -->
<div class="item">
  <div class="sticker e e15 g3 dark s30">
    <div class="scale">
      <div class="ring-h"></div>
      <div class="ring-v"></div>
      <div class="rubyg"></div>
      <div class="party-text rainbow-rev-green2">PARTY</div>
      <div class="spark pink" style="left: 10mm; top: 36.25mm;"></div>
      <div class="spark blue" style="left: 38.7mm; top: 36.25mm;"></div>
    </div>
  </div>
  <div class="label">G10</div>
</div>

<!-- G11: G9 のルビーの右上に十字光(宝石の反射)、左下に小さく -->
<div class="item">
  <div class="sticker e e15 g3 dark s30">
    <div class="scale">
      <div class="ring-h"></div>
      <div class="ring-v"></div>
      <div class="rubyg"></div>
      <div class="party-text rainbow-rev-green2">PARTY</div>
      <div class="spark pink" style="left: 37.5mm; top: 9.5mm;"></div>
      <div class="spark blue" style="left: 10.5mm; top: 27mm;"></div>
    </div>
  </div>
  <div class="label">G11</div>
</div>

</div>

<div class="row">
<!-- G2: G に E6 の電飾の枠 -->
<div class="item">
  <div class="sticker e e15 g2 dark s30">
    <div class="scale">
      <div class="ring-h"></div>
      <div class="ring-v"></div>
      <div class="rubyg"></div>
      <div class="party-text">Official<br>Party</div>
    </div>
  </div>
  <div class="label">G2</div>
</div>

<!-- G: Official / Party の 2 行で大きく -->
<div class="item">
  <div class="sticker e e15 dark s30">
    <div class="scale">
      <div class="rubyg"></div>
      <div class="party-text">Official<br>Party</div>
    </div>
  </div>
  <div class="label">G</div>
</div>

<!-- F: E3 に Official Party を 1 行 -->
<div class="item">
  <div class="sticker e e14 dark s30">
    <div class="scale">
      <div class="rubyg"></div>
      <div class="party-text">Official Party</div>
    </div>
  </div>
  <div class="label">F</div>
</div>

<!-- C を 30mm 角に -->
<div class="item">
  <div class="sticker c dark s30">
    <div class="scale">
      <div class="title">
        <div class="prk stack"><span class="picoruby"><span class="kP">P</span><span class="k4">ic</span>oRu<span class="k2">b</span>y</span><span class="kaigi"><span class="k4">K</span><span class="k3">a</span><span class="k5">i</span><span class="k3">g</span>i</span></div>
        <div class="year">2026</div>
        <div class="assemble">Assemble</div>
      </div>
      <div class="spark pink" style="left: 41.5mm; top: 6.5mm;"></div>
      <div class="spark blue" style="left: 6.5mm; top: 41.5mm;"></div>
      <div class="confetti r45" style="left: 20mm; top: 8mm; background: #55d6f2;"></div>
      <div class="confetti r45" style="left: 8mm; top: 23mm; background: #ffc12e;"></div>
      <div class="confetti" style="left: 42.5mm; top: 25mm; background: #6ef0a0;"></div>
      <div class="confetti r45" style="left: 36mm; top: 43mm; background: #fb5479;"></div>
      <div class="confetti" style="left: 17mm; top: 44.5mm; background: #55d6f2;"></div>
    </div>
  </div>
  <div class="label">C</div>
</div>

<!-- C2: C に E と同じ夜空のグラデーション -->
<div class="item">
  <div class="sticker c dark party s30">
    <div class="scale">
      <div class="title">
        <div class="prk stack"><span class="picoruby"><span class="kP">P</span><span class="k4">ic</span>oRu<span class="k2">b</span>y</span><span class="kaigi"><span class="k4">K</span><span class="k3">a</span><span class="k5">i</span><span class="k3">g</span>i</span></div>
        <div class="year">2026</div>
