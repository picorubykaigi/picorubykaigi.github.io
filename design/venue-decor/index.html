<script>

  const FACES = ['a', 'b', 'c', 'd'];
  const MODES = ['light'];
  const params = new URLSearchParams(location.search);
  const captureTarget = params.get('capture');
  for (const face of FACES) {
    for (const mode of MODES) {
      if (captureTarget && captureTarget !== face) continue;
      const wrap = document.createElement('div');
      wrap.className = 'wrap';
      wrap.dataset.face = face;
      const sheet = document.getElementById(`proto-${face}`).content.firstElementChild.cloneNode(true);
      sheet.classList.add(mode);
      wrap.appendChild(sheet);
      document.body.appendChild(wrap);
    }
  }
  if (captureTarget) document.body.classList.add('capture');

  async function knockoutDots() {
    await document.fonts.ready;
    const G = 20, D0 = 7.9, D1 = 13.4, LW = 6;
    const rectMode = params.get('knock') === 'rect';
    for (const sheet of document.querySelectorAll('.sheet')) {
      const sr = sheet.getBoundingClientRect();
      const cv = document.createElement('canvas');
      cv.width = 1507; cv.height = 1177;
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.lineWidth = LW; ctx.lineJoin = 'miter'; ctx.lineCap = 'butt';
      ctx.strokeStyle = '#000'; ctx.fillStyle = '#000'; ctx.textBaseline = 'alphabetic';
      const boxes = [];
      const glyphBoxes = [];
      for (const prk of sheet.querySelectorAll('.prk')) {
        let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
        for (const span of prk.querySelectorAll('.picoruby, .kaigi')) {
          const cs = getComputedStyle(span);
          const font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
          await document.fonts.load(font, span.textContent);
          ctx.font = font;
          const asc = ctx.measureText('H').fontBoundingBoxAscent;
          const walker = document.createTreeWalker(span, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            const text = node.nodeValue;
            for (let i = 0; i < text.length; i++) {
              const ch = text[i];
              if (ch.trim() === '') continue;
              const range = document.createRange();
              range.setStart(node, i); range.setEnd(node, i + 1);
              const r = range.getBoundingClientRect();
              const x = r.left - sr.left, base = r.top - sr.top + asc;
              if (rectMode) {
                bx0 = Math.min(bx0, r.left - sr.left); bx1 = Math.max(bx1, r.right - sr.left);
                by0 = Math.min(by0, r.top - sr.top); by1 = Math.max(by1, r.bottom - sr.top);
              } else {
                ctx.strokeText(ch, x, base);
                ctx.fillText(ch, x, base);
                const m = ctx.measureText(ch);
                glyphBoxes.push([x - m.actualBoundingBoxLeft + 2.5, base - m.actualBoundingBoxAscent + 2.5,
                                 x + m.actualBoundingBoxRight - 2.5, base + m.actualBoundingBoxDescent - 2.5]);
              }
            }
          }
        }
        if (rectMode && isFinite(bx0)) boxes.push([bx0 - 6, by0 - 6, bx1 + 6, by1 + 6]);
      }
      if (rectMode) for (const [x0, y0, x1, y1] of boxes) ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      const data = ctx.getImageData(0, 0, cv.width, cv.height).data;
      const hit = (px0, py0, px1, py1) => {
        for (let y = Math.floor(py0); y < Math.ceil(py1); y++)
          for (let x = Math.floor(px0); x < Math.ceil(px1); x++)
            if (data[(y * cv.width + x) * 4 + 3] > 0) return true;
        return false;
      };
      if (params.get('dbg')) sheet.dataset.glyphs = JSON.stringify(glyphBoxes.map(b => b.map(v => Math.round(v * 10) / 10)));
      const inkOnLine = (x0, y0, x1, y1) => {
        const dx = Math.sign(x1 - x0), dy = Math.sign(y1 - y0);
        const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
        for (let i = 0; i <= n; i++) {
          const x = Math.round(x0 + dx * i), y = Math.round(y0 + dy * i);

      };
      const inkOn = (x0, y0, x1, y1) => [-2, 0, 2].every(o => (y0 === y1) ? inkOnLine(x0, y0 + o, x1, y1 + o) : inkOnLine(x0 + o, y0, x1 + o, y1));

      const RUBYM_SIL = [[0.221,0.781],[0.205,0.795],[0.205,0.795],[0.205,0.795],[0.217,0.781],[0.235,0.742],[0.027,0.97],[0.011,0.986],[0,1],[0,1],[0.014,0.986],[0.027,0.97],[0.258,0.74],[0.219,0.781],[0.205,0.795],[0.205,0.795],[0.205,0.795],[0.228,0.769],[0.466,0.537],[0.427,0.573],[0.413,0.589],[0.413,0.589],[0.413,0.589],[0.427,0.573]];
      for (const el of sheet.querySelectorAll('.ruby, .rubym')) {
        const mini = el.classList.contains('rubym');
